<script>
(() => {
  const form = document.getElementById('unlock-form');
  const input = document.getElementById('password');
  const button = document.getElementById('unlock-button');
  const status = document.getElementById('unlock-status');
  const payload = JSON.parse(document.getElementById('locked-content').textContent);
  const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    if (!globalThis.crypto?.subtle) {
      status.textContent = '当前浏览器不支持解锁，请使用新版浏览器并通过 HTTPS 访问。';
      return;
    }
    button.disabled = true;
    input.disabled = true;
    button.textContent = '正在解锁…';
    status.textContent = '';
    input.removeAttribute('aria-invalid');
    let html;
    try {
      const encoder = new TextEncoder();
      const material = await crypto.subtle.importKey('raw', encoder.encode(input.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(payload.salt), iterations:payload.iterations, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const decrypted = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(payload.iv), additionalData:encoder.encode('ntn/satellite-basics.html:v1')}, key, bytes(payload.ciphertext));
      html = new TextDecoder('utf-8', {fatal:true}).decode(decrypted);
    } catch {
      status.textContent = '密码不正确，请重新输入。';
      input.setAttribute('aria-invalid', 'true');
      input.disabled = false;
      button.disabled = false;
      button.textContent = '解锁查看';
      input.focus();
      input.select();
      return;
    }
    input.value = '';
    document.open();
    document.write(html);
